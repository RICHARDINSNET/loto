<head>

<style>
:root{
  color-scheme:light;
  --bg:#f4f3ef;--surface:#fcfcfb;--line:#e4e2dc;--grid:#ecebe6;
  --text:#0b0b0b;--text2:#52514e;--muted:#8a8984;
  --p0:#2a78d6;--p1:#eb6834;--p2:#1baf7a;
  --accent:#2a78d6;--bad:#c4312f;--badbg:#fdecea;--good:#0b7a3b;--goodbg:#e6f4ea;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#121211;--surface:#1a1a19;--line:#2c2b29;--grid:#262624;
  --text:#f0efec;--text2:#c3c2b7;--muted:#8d8c86;
  --p0:#3987e5;--p1:#d95926;--p2:#199e70;
  --accent:#3987e5;--bad:#ef7a78;--badbg:#3a1f1e;--good:#5cc98a;--goodbg:#16301f;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#back{display:none;border:0;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:26px;line-height:1;width:38px;height:38px;border-radius:10px;cursor:pointer;padding:0 0 3px}
body.sub #back{display:block}
body.sub .brand span{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sq{aspect-ratio:1/1;border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:16px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;text-align:left;font:inherit;color:var(--text)}
.sq:active{transform:scale(.98)}
.sq svg{width:38px;height:38px}
.sq .t{font-size:18px;font-weight:700}
.sq .d{font-size:13px;color:var(--text2);margin-top:4px;line-height:1.35}
.sq.k1 svg{color:#2a78d6}.sq.k2 svg{color:#c98500}.sq.k3 svg{color:#1baf7a}.sq.k4 svg{color:#eb6834}
.brand h1{margin:0;font-size:24px;letter-spacing:-.02em}
.brand span{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
nav button{border:0;background:none;color:var(--text2);font:inherit;font-weight:600;padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--text);border-bottom-color:var(--accent)}
main{max-width:860px;margin:0 auto;padding:16px}
section{display:none}section.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:16px}
.card h2 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px;position:relative;overflow:hidden}
.tile .name{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--text2);font-size:13px}
.tile .big{font-size:34px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12px;color:var(--muted)}
.tile.pays{background:var(--badbg);border-color:transparent}
.tile.lead{background:var(--goodbg);border-color:transparent}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;margin-top:6px}
.badge.bad{background:var(--bad);color:#fff}.badge.good{background:var(--good);color:#fff}
.hero{font-size:15px;color:var(--text2);margin:0 0 12px}
.hero b{color:var(--text)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--grid);font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600}
td:first-child,th:first-child{text-align:left}
td.lo{color:var(--bad);font-weight:700}
td.hi{color:var(--good);font-weight:700}
.scroll{overflow-x:auto}
select,input{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:none;color:var(--text2);border:1px solid var(--line)}
.form{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;align-items:end}
.form label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.form input{width:100%}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:none;color:var(--text);font:inherit;font-size:18px;width:34px;height:38px;cursor:pointer}
.stepper span{flex:1;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--text2);margin-bottom:8px}
.legend span{display:flex;align-items:center;gap:6px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;white-space:nowrap;z-index:3}
.tip b{display:block;margin-bottom:2px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--grid);font-size:14px}
.list li:last-child{border-bottom:0}
.list .meta{color:var(--muted);font-size:12px}
.bar{height:8px;border-radius:4px;background:var(--accent);opacity:.85}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv div:nth-child(odd){color:var(--text2)}
.kv div:nth-child(even){font-weight:600;text-align:right}
.mine{font-size:11px;color:var(--accent);font-weight:700}
@media (max-width:560px){.tile .big{font-size:28px}.form{grid-template-columns:1fr 1fr}main{padding:12px}}
</style>
</head>

<script>
(function(){
const D=window.LOTO_DATA, P=D.jugadores, N=P.length;
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIA={L:'Lun',M:'Mar',X:'Mié',J:'Jue',V:'Vie',S:'Sáb',D:'Dom'};
const col=i=>`var(--p${i})`;
const dot=i=>`<span class="dot" style="background:${col(i)}"></span>`;
const $=s=>document.querySelector(s);
const STORE='loto.local.v1';
let local={};try{local=JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){}
function saveLocal(){try{localStorage.setItem(STORE,JSON.stringify(local))}catch(e){}}

// merge local draws into data
const meses=D.meses.map(m=>Object.assign({},m,{draws:m.draws.slice()}));
const cur=meses[meses.length-1];
function curDraws(){const extra=(local.draws||[]).map(x=>Object.assign({mine:true},x));return cur.draws.concat(extra).sort((a,b)=>a.d-b.d)}
function recalcCur(){const d=curDraws();cur.tot=[0,1,2].map(i=>d.reduce((s,x)=>s+(+x.p[i]||0),0))}
recalcCur();
const label=m=>(m.label||MES[m.m-1]);

// who pays: the lowest score; ties -> several
function lows(t){const mn=Math.min(...t);return t.map((v,i)=>v===mn?i:-1).filter(i=>i>=0)}
function highs(t){const mx=Math.max(...t);return t.map((v,i)=>v===mx?i:-1).filter(i=>i>=0)}
function payer(m){const l=lows(m.tot);return l.length===1?l[0]:(l.length===N?'all':l)}

const closed=()=>meses.filter(m=>!m.enCurso);
// ---------- ESTE MES ----------
function renderMes(){
  recalcCur();
  const t=cur.tot, lo=lows(t), hi=highs(t), d=curDraws();
  const order=[0,1,2].sort((a,b)=>t[b]-t[a]);
  let heroTxt;
  if(lo.length===N) heroTxt='Ahora mismo vais <b>empatados los tres</b>.';
  else if(lo.length>1) heroTxt=`Ahora mismo hay <b>empate abajo</b> entre ${lo.map(i=>P[i]).join(' y ')}.`;
  else {const gap=Math.min(...t.filter((v,i)=>i!==lo[0]))-t[lo[0]];heroTxt=`Si acabara hoy, pagaría <b>${P[lo[0]]}</b> (a ${gap} punto${gap===1?'':'s'} de salvarse).`}
  const pend=pendientes();
  $("#v-mes").innerHTML=`
  <div class="card">
    <h2>${label(cur)} ${cur.y} <small>${d.length} sorteos jugados</small></h2>
    <p class="hero">${heroTxt}</p>
    <div class="tiles">${order.map(i=>`
      <div class="tile ${lo.length<N&&lo.includes(i)?'pays':''} ${hi.length<N&&hi.includes(i)?'lead':''}">
        <div class="name">${dot(i)}${P[i]}</div>
        <div class="big">${t[i]}</div>
        <div class="sub">puntos</div>
        ${lo.length<N&&lo.includes(i)?'<span class="badge bad">Paga</span>':''}${hi.length<N&&hi.includes(i)?'<span class="badge good">Líder</span>':''}
      </div>`).join('')}</div>
  </div>
  <div class="card">
    <h2>Apuntar sorteo</h2>
    <form class="form" id="fAdd">
      <label>Día<input type="number" id="fDay" min="1" max="31" required value="${nextDay(d)}"></label>
      ${P.map((p,i)=>`<label>${p}<div class="stepper" data-i="${i}"><button type="button" data-s="-1">−</button><span id="st${i}">0</span><button type="button" data-s="1">+</button></div></label>`).join('')}
    </form>
    <div class="row" style="margin-top:10px"><button class="btn" id="bAdd">Guardar sorteo</button></div>
    <div class="note">De momento se guarda solo en este móvil. Cuando la publiquemos en GitHub lo conectamos para que lo veáis los tres.</div>
  </div>
  <div class="card">
    <h2>Sorteos de ${label(cur).toLowerCase()}</h2>
    <div class="scroll"><table><thead><tr><th>Día</th>${P.map((p,i)=>`<th>${dot(i)} ${D.corto[i]}</th>`).join('')}<th></th></tr></thead>
    <tbody>${d.slice().reverse().map(x=>{const mx=Math.max(...x.p);return `<tr><td>${DIA[x.wd]||''} ${x.d} ${x.mine?'<span class="mine">nuevo</span>':''}</td>${x.p.map(v=>`<td class="${v===mx&&mx>0?'hi':''}">${v}</td>`).join('')}<td>${x.mine?`<button class="btn ghost" data-del="${x.id}" style="padding:4px 8px;font-size:12px">Quitar</button>`:''}</td></tr>`}).join('')}</tbody></table></div>
  </div>
  ${pend.length?`<div class="card"><h2>Cenas pendientes <small>${pend.length}</small></h2><ul class="list">${pend.map(m=>{const p=payer(m);return `<li><span>${label(m)} ${m.y}</span><span>${whoTxt(p)} <span class="meta">${m.tot.join(' · ')}</span></span></li>`}).join('')}</ul></div>`:''}
  `;
  // stepper
  const vals=[0,0,0];
  document.querySelectorAll('.stepper').forEach(st=>st.addEventListener('click',e=>{const s=+e.target.dataset.s;if(!s)return;const i=+st.dataset.i;vals[i]=Math.max(0,Math.min(6,vals[i]+s));$('#st'+i).textContent=vals[i]}));
  $('#bAdd').onclick=()=>{
    const day=+$('#fDay').value;if(!(day>=1&&day<=31))return;
    const wd='DLMXJVS'[new Date(cur.y,cur.m-1,day).getDay()];
    (local.draws=local.draws||[]).push({id:Date.now(),d:day,wd,p:vals.slice()});saveLocal();renderAll();
  };
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{local.draws=(local.draws||[]).filter(x=>x.id!=b.dataset.del);saveLocal();renderAll()});
}
function nextDay(d){const last=d.length?d[d.length-1].d:0;for(let k=last+1;k<=31;k++){const g=new Date(cur.y,cur.m-1,k);if(g.getMonth()!==cur.m-1)break;if([1,4,6].includes(g.getDay()))return k}return last+1}
function whoTxt(p){return p==='all'?'Triple empate':Array.isArray(p)?'Empate '+p.map(i=>P[i]).join('/'):`${dot(p)} <b>${P[p]}</b>`}
function pendientes(){
  // from 2021 on, months without registered dinner
  return closed().filter(m=>m.y>=2021&&!m.pago);
}
function legend(){return `<div class="legend">${P.map((p,i)=>`<span>${dot(i)}${p}</span>`).join('')}</div>`}

// ---------- CLASIFICACIÓN ----------
let clFilter='all';
function inFilter(m){
  if(clFilter==='all')return true;
  if(clFilter==='nuevo')return m.y>2022||(m.y===2022&&m.m>=9);
  if(clFilter==='viejo')return m.y<2022||(m.y===2022&&m.m<9);
  return m.y===+clFilter;
}
function stats(ms){
  const s=P.map(()=>({pts:0,pago:0,emp:0,gana:0,meses:0,draws:0,dpts:0,best:null,worst:null}));
  ms.forEach(m=>{
    const p=payer(m),h=highs(m.tot);
    m.tot.forEach((v,i)=>{s[i].pts+=v;s[i].meses++;});
    if(typeof p==='number')s[p].pago++;else if(Array.isArray(p))p.forEach(i=>s[i].emp++);
    if(h.length===1)s[h[0]].gana++;
    m.draws.forEach(x=>x.p.forEach((v,i)=>{if(typeof v==='number'){s[i].draws++;s[i].dpts+=v}}));
  });
  // streaks without paying (consecutive closed months)
  P.forEach((_,i)=>{let run=0,best=0,bestEnd=null;ms.forEach(m=>{if(payer(m)===i){run=0}else{run++;if(run>best){best=run;bestEnd=m}}});s[i].racha=best;s[i].rachaEnd=bestEnd;
    let cr=0;for(let k=ms.length-1;k>=0;k--){if(payer(ms[k])===i)break;cr++}s[i].rachaAct=cr;});
  return s;
}
function renderClasif(){
  const ms=closed().filter(inFilter); const s=stats(ms);
  const years=[...new Set(meses.map(m=>m.y))].reverse();
  const ord=[0,1,2].sort((a,b)=>s[a].pago-s[b].pago||s[b].pts-s[a].pts);
  const maxPago=Math.max(...s.map(x=>x.pago),1);
  // records
  let rec={hiM:null,loM:null};ms.forEach(m=>m.tot.forEach((v,i)=>{if(m.draws.length||m.y>=2022){}}));
  const recMonth=(fn)=>{let r=null;ms.forEach(m=>m.tot.forEach((v,i)=>{if(!r||fn(v,r.v))r={v,i,m}}));return r};
  const eraOld=ms.filter(m=>m.y<2022||(m.y===2022&&m.m<9)), eraNew=ms.filter(m=>!(m.y<2022||(m.y===2022&&m.m<9)));
  const pick=arr=>arr.length?{hi:(()=>{let r=null;arr.forEach(m=>m.tot.forEach((v,i)=>{if(!r||v>r.v)r={v,i,m}}));return r})(),lo:(()=>{let r=null;arr.forEach(m=>m.tot.forEach((v,i)=>{if(!r||v<r.v)r={v,i,m}}));return r})()}:null;
  const rOld=pick(eraOld), rNew=pick(eraNew);
  $("#v-clasif").innerHTML=`
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="margin:0">Quién paga más <small>${ms.length} meses</small></h2>
      <select id="clSel">
        <option value="all">Todo (desde 2010)</option>
        <option value="viejo">Formato antiguo (hasta jul 2022)</option>
        <option value="nuevo">Formato actual (desde sep 2022)</option>
        ${years.map(y=>`<option value="${y}">${y}</option>`).join('')}
      </select>
    </div>
    <div class="tiles">${ord.map((i,k)=>`
      <div class="tile ${k===2?'pays':''} ${k===0?'lead':''}">
        <div class="name">${dot(i)}${P[i]}</div>
        <div class="big">${s[i].pago}</div>
        <div class="sub">cenas pagadas${s[i].emp?` · ${s[i].emp} empates`:''}</div>
      </div>`).join('')}</div>
    <div class="chart" id="chPago" style="margin-top:14px"></div>
  </div>
  <div class="card">
    <h2>Números</h2>
    <div class="scroll"><table>
      <thead><tr><th></th>${P.map((p,i)=>`<th>${dot(i)} ${D.corto[i]}</th>`).join('')}</tr></thead>
      <tbody>
        ${row('Cenas pagadas',s.map(x=>x.pago),'lo-hi')}
        ${row('Meses ganados (1º)',s.map(x=>x.gana),'hi')}
        ${row('Puntos totales',s.map(x=>x.pts),'hi')}
        ${row('Media por mes',s.map(x=>x.meses?(x.pts/x.meses).toFixed(1):'–'),'hi')}
        ${row('Media por sorteo',s.map(x=>x.draws?(x.dpts/x.draws).toFixed(2):'–'),'hi')}
        ${row('Racha sin pagar (récord)',s.map(x=>x.racha+' m'),'hi')}
        ${row('Racha actual sin pagar',s.map(x=>x.rachaAct+' m'),'hi')}
      </tbody></table></div>
    <div class="note">Paga el que menos puntos hace en el mes. Si empatan abajo, cuenta como empate y no suma a nadie. "Media por sorteo" solo usa los meses con el detalle de cada sorteo (2010–2021).</div>
  </div>
  <div class="card"><h2>Récords</h2><div class="kv">
    ${rOld?`<div>Mejor mes (formato antiguo)</div><div>${dot(rOld.hi.i)} ${P[rOld.hi.i]} · ${rOld.hi.v} pts · ${label(rOld.hi.m)} ${rOld.hi.m.y}</div>
    <div>Peor mes (formato antiguo)</div><div>${dot(rOld.lo.i)} ${P[rOld.lo.i]} · ${rOld.lo.v} pts · ${label(rOld.lo.m)} ${rOld.lo.m.y}</div>`:''}
    ${rNew?`<div>Mejor mes (formato actual)</div><div>${dot(rNew.hi.i)} ${P[rNew.hi.i]} · ${rNew.hi.v} pts · ${label(rNew.hi.m)} ${rNew.hi.m.y}</div>
    <div>Peor mes (formato actual)</div><div>${dot(rNew.lo.i)} ${P[rNew.lo.i]} · ${rNew.lo.v} pts · ${label(rNew.lo.m)} ${rNew.lo.m.y}</div>`:''}
  </div></div>`;
  $('#clSel').value=clFilter;
  $('#clSel').onchange=e=>{clFilter=e.target.value;renderClasif()};
  // cumulative dinners paid over time (all filtered months)
  const cum=[0,1,2].map(()=>[]);const c=[0,0,0];
  ms.forEach(m=>{const p=payer(m);if(typeof p==='number')c[p]++;c.forEach((v,i)=>cum[i].push(v))});
  document.querySelector('#chPago').insertAdjacentHTML('beforebegin',`<div style="font-size:13px;font-weight:600;margin:4px 0 6px">Cenas pagadas acumuladas</div>${legend()}`);
  lineChart('#chPago',ms.map(m=>`${label(m).slice(0,3)} ${m.y}`),cum,{noDots:true});
}
function row(name,vals,mode){
  const nums=vals.map(v=>parseFloat(v));const mx=Math.max(...nums),mn=Math.min(...nums);
  return `<tr><td>${name}</td>${vals.map((v,i)=>{let c='';if(mode==='lo-hi'){if(nums[i]===mx)c='lo';else if(nums[i]===mn)c='hi'}else if(nums[i]===mx&&mx!==mn)c='hi';return `<td class="${c}">${v}</td>`}).join('')}</tr>`;
}

// ---------- HISTÓRICO ----------
let histYear=null;
function renderHist(){
  const years=[...new Set(meses.map(m=>m.y))].reverse();

  const ms=meses.filter(m=>m.y===histYear);

    <div class="scroll"><table>
      <thead><tr><th>Mes</th>${P.map((p,i)=>`<th>${dot(i)} ${D.corto[i]}</th>`).join('')}<th>Paga</th></tr></thead>
      <tbody>${ms.map(m=>{const lo=lows(m.tot),hi=highs(m.tot),p=payer(m);return `<tr><td>${label(m)}${m.enCurso?' <span class="meta" style="color:var(--muted);font-size:11px">en curso</span>':''}</td>${m.tot.map((v,i)=>`<td class="${lo.length<N&&lo.includes(i)?'lo':hi.length<N&&hi.includes(i)?'hi':''}">${v}</td>`).join('')}<td style="font-size:13px">${m.enCurso?'–':whoTxt(p)}</td></tr>`}).join('')}
      <tr><td><b>Total</b></td>${totY.map(v=>`<td><b>${v}</b></td>`).join('')}<td></td></tr></tbody>
    </table></div>
    <div class="note">En rojo el que paga ese mes, en verde el que gana.</div>
  </div>`;
  $('#hSel').onchange=e=>{histYear=+e.target.value;renderHist()};
  barChart('#chAnio',per.map(x=>String(x.y).slice(2)),per.map(x=>x.c),per.map(x=>x.y));
}

// ---------- CENAS ----------
function renderCenas(){
  const pend=pendientes();
  const paid=closed().filter(m=>m.pago).slice().reverse();
  const norm=s=>(s||'').toUpperCase().replace(/\s{2,}.*/,'').replace(/^EL /,'').trim();
  const sitios={};paid.forEach(m=>{const k=norm(m.pago.sitio);if(k&&k!=='COMPENSADAS')sitios[k]=(sitios[k]||0)+1});
  const top=Object.entries(sitios).sort((a,b)=>b[1]-a[1]).slice(0,10);const mx=top.length?top[0][1]:1;
  const fmt=f=>{if(!f)return '';const [y,mo,d]=f.split('-');return `${+d}/${+mo}/${y.slice(2)}`};
  $("#v-cenas").innerHTML=`
  ${pend.length?`<div class="card"><h2>Pendientes <small>${pend.length} cenas por hacer</small></h2><ul class="list">${pend.map(m=>`<li><span>${label(m)} ${m.y}</span><span>${whoTxt(payer(m))}</span></li>`).join('')}</ul></div>`:''}
  <div class="card"><h2>Sitios favoritos</h2>
    ${top.map(([k,v])=>`<div style="display:grid;grid-template-columns:150px 1fr 28px;gap:10px;align-items:center;margin:6px 0;font-size:13px"><span>${cap(k)}</span><div class="bar" style="width:${v/mx*100}%"></div><b style="text-align:right">${v}</b></div>`).join('')}
  </div>
  <div class="card"><h2>Todas las cenas <small>${paid.length}</small></h2><ul class="list">
    ${paid.map(m=>`<li><span>${label(m)} ${m.y}<br><span class="meta">${whoTxt(payer(m))}</span></span><span style="text-align:right">${cap(m.pago.sitio||'—')}<br><span class="meta">${fmt(m.pago.fecha)}${m.pago.importe?` · ${m.pago.importe} €`:''}</span></span></li>`).join('')}
  </ul></div>`;
}
const cap=s=>s.toLowerCase().replace(/(^|[\s\-(/'])(\p{L})/gu,(a,b,c)=>b+c.toUpperCase());

// ---------- charts ----------
const tip=$('#tip');
function showTip(e,html){tip.innerHTML=html;tip.style.display='block';const r=tip.getBoundingClientRect();let x=e.clientX+12,y=e.clientY+12;if(x+r.width>innerWidth-8)x=e.clientX-r.width-12;tip.style.left=x+'px';tip.style.top=(y+scrollY)+'px'}
function hideTip(){tip.style.display='none'}
function lineChart(sel,labels,series,opt={}){
  const el=$(sel);const W=Math.max(el.clientWidth||600,280),H=220,m={l:30,r:10,t:10,b:24};
  const n=labels.length;if(!n){el.innerHTML='<div class="note">Aún no hay sorteos.</div>';return}
  const mx=Math.max(1,...series.flat());const step=niceStep(mx);const top=Math.ceil(mx/step)*step;
  const x=i=>m.l+(n===1?(W-m.l-m.r)/2:i*(W-m.l-m.r)/(n-1)), y=v=>m.t+(H-m.t-m.b)*(1-v/top);
  let g='';for(let v=0;v<=top;v+=step)g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${m.l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
  const every=Math.ceil(n/Math.max(2,Math.floor((W-m.l)/(labels[0].length>7?80:52))));let xl='';labels.forEach((l,i)=>{if(i%every===0||i===n-1)xl+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${l}</text>`});
  const lines=series.map((s,k)=>`<path d="${s.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join('')}" fill="none" stroke="${col(k)}" stroke-width="2" stroke-linejoin="round"/>`+(opt.noDots||n>40?'':s.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${col(k)}" stroke="var(--surface)" stroke-width="2"/>`).join(''))).join('');
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img">${g}${xl}<line id="xh" y1="${m.t}" y2="${H-m.b}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>${lines}<rect x="${m.l}" y="0" width="${W-m.l-m.r}" height="${H}" fill="transparent" class="hit"/></svg>`;
  const svg=el.querySelector('svg'),xh=svg.querySelector('#xh');
  svg.querySelector('.hit').addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)*W/r.width;const i=n===1?0:Math.max(0,Math.min(n-1,Math.round((px-m.l)/((W-m.l-m.r)/(n-1)))));xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.setAttribute('visibility','visible');
    const ord=[0,1,2].sort((a,b)=>series[b][i]-series[a][i]);showTip(e,`<b>${labels[i]}</b>${ord.map(k=>`<div>${dot(k)} ${P[k]}: <b style="display:inline">${series[k][i]}</b></div>`).join('')}`)});
  svg.querySelector('.hit').addEventListener('pointerleave',()=>{xh.setAttribute('visibility','hidden');hideTip()});
}
function barChart(sel,labels,groups,full){
  const el=$(sel);const W=Math.max(el.clientWidth||600,280),H=200,m={l:24,r:6,t:10,b:22};
  const n=labels.length,mx=Math.max(1,...groups.flat());const step=niceStep(mx,4);const top=Math.ceil(mx/step)*step;
  const gw=(W-m.l-m.r)/n,bw=Math.max(2,Math.min(12,(gw-4)/3-2));const y=v=>m.t+(H-m.t-m.b)*(1-v/top);
  let s='';for(let v=0;v<=top;v+=step)s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${m.l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
  groups.forEach((g,j)=>{const cx=m.l+gw*j+gw/2;const x0=cx-(3*bw+4)/2;
    g.forEach((v,k)=>{if(!v)return;const xx=x0+k*(bw+2),yy=y(v),h=y(0)-yy,r=Math.min(3,bw/2,h);s+=`<path d="M${xx} ${y(0)}V${yy+r}q0 -${r} ${r} -${r}h${bw-2*r}q${r} 0 ${r} ${r}V${y(0)}Z" fill="${col(k)}"/>`});
    s+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${labels[j]}</text><rect x="${m.l+gw*j}" y="0" width="${gw}" height="${H}" fill="transparent" data-j="${j}"/>`});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${s}</svg>`;
  el.querySelectorAll('rect[data-j]').forEach(r=>{r.addEventListener('pointermove',e=>{const j=+r.dataset.j;showTip(e,`<b>${full[j]}</b>${[0,1,2].map(k=>`<div>${dot(k)} ${P[k]}: <b style="display:inline">${groups[j][k]}</b></div>`).join('')}`)});r.addEventListener('pointerleave',hideTip);r.addEventListener('click',()=>{histYear=full[+r.dataset.j];renderHist()})});
}
function niceStep(mx,t=5){const raw=mx/t,p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p||1}

// ---------- inicio ----------
function renderInicio(){
  recalcCur();
  const lo=lows(cur.tot),pend=pendientes(),cs=closed();
  const s=stats(cs);const minPago=Math.min(...s.map(x=>x.pago));const lider=[0,1,2].filter(i=>s[i].pago===minPago);
  const mesTxt=lo.length===N?'Empatados los tres':lo.length>1?'Empate abajo':`Ahora paga ${P[lo[0]]}`;
  const ic={
    mes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    clasif:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>',
    hist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
    cenas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5a2 2 0 0 0 2 2M9 3v5M17 21V3c-2 1-3 4-3 7h3"/></svg>'};
  $('#v-inicio').innerHTML=`<div class="grid">
    <button class="sq k1" data-go="mes">${ic.mes}<div><div class="t">Este mes</div><div class="d">${label(cur)}: ${cur.tot.join(' · ')}<br>${mesTxt}</div></div></button>
    <button class="sq k2" data-go="clasif">${ic.clasif}<div><div class="t">Clasificación</div><div class="d">Menos cenas pagadas: ${lider.map(i=>P[i]).join(' y ')}</div></div></button>
    <button class="sq k3" data-go="hist">${ic.hist}<div><div class="t">Histórico</div><div class="d">Desde ${MES[meses[0].m-1].toLowerCase()} ${meses[0].y}, año a año</div></div></button>
    <button class="sq k4" data-go="cenas">${ic.cenas}<div><div class="t">Cenas</div><div class="d">${pend.length?pend.length+' pendientes':'Ninguna pendiente'}</div></div></button>
  </div>`;
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.go});
}
// ---------- nav ----------
const R={inicio:renderInicio,mes:renderMes,clasif:renderClasif,hist:renderHist,cenas:renderCenas};
let view='inicio';
function show(v){view=v;document.body.classList.toggle('sub',v!=='inicio');document.querySelectorAll('section').forEach(s=>s.classList.toggle("on",s.id==="v-"+v));R[v]();scrollTo(0,0)}
function renderAll(){R[view]()}
$('#back').onclick=()=>{if(history.length>1&&view!=='inicio'&&sessionStorage.getItem('lotoNav'))history.back();else location.hash='inicio'};
addEventListener('hashchange',()=>{try{sessionStorage.setItem('lotoNav','1')}catch(e){}const h=location.hash.slice(1);show(R[h]?h:'inicio')});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderAll,150)});
show('inicio');if(location.hash&&location.hash!=='#inicio')history.replaceState(null,'',location.pathname+location.search);
})();
</script>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});let _r=0;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!_r){_r=1;location.reload()}});</script>
